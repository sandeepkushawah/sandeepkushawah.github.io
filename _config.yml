# Site configuration for sandeepkushawah.github.io (Jekyll on GitHub Pages).
# Restart `jekyll serve` after editing this file. Maintenance notes: CLAUDE.md.

# ---------------------------------------------------------------- Site
locale                   : "en-US"
title                    : "Sandeep Kushawah"
description              : "Computational Soft Matter Physicist"
url                      : "https://sandeepkushawah.github.io"
baseurl                  : ""
repository               : "sandeepkushawah/sandeepkushawah.github.io"
timezone                 : Asia/Kolkata
future                   : true

# ---------------------------------------------------------------- Author
# Used in the page header/footer, contact page, CV page and search metadata.
author:
  name             : "Sandeep Kushawah"
  bio              : "I have submitted my Ph.D. thesis at IIT Mandi on the glass transition in supercooled liquids, studied with molecular dynamics simulations."
  location         : "India"
  employer         : "Indian Institute of Technology Mandi"
  email            : "sandeep.kushawah@outlook.com"
  googlescholar    : "https://scholar.google.com/citations?user=2SUAJIwAAAAJ&hl=en"
  orcid            : "0009-0003-5052-4398"
  github           : "sandeepkushawah"
  linkedin         : "sandeep-kushawah"

# ---------------------------------------------------------------- Visitor counter
# Footer visit counter via the free Abacus API (no account, no cookies, one count
# per browser session). Remove the namespace to hide it. If you create a
# GoatCounter account (goatcounter.com), put its site code in goatcounter_code
# and the footer switches to GoatCounter instead.
visitor_counter:
  namespace              : "sandeepkushawah-github-io"
  key                    : "visits"
goatcounter_code         : ""

# ---------------------------------------------------------------- Search engines
# Google Search Console: add the property "https://sandeepkushawah.github.io/",
# choose the "HTML tag" verification method and paste ONLY the content="..." value
# below, e.g.  google_site_verification : "AbCdEf123..."
# After verifying, submit https://sandeepkushawah.github.io/sitemap.xml there.
google_site_verification :
bing_site_verification   :

# ---------------------------------------------------------------- Publications
publication_category:
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'
  books:
    title: 'Books'

# ---------------------------------------------------------------- Content
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: pages }
    values: { layout: page-modern }
  - scope: { path: "", type: publications }
    values: { layout: publication }
  - scope: { path: "", type: portfolio }
    values: { layout: portfolio }
  - scope: { path: "", type: talks }
    values: { layout: talk }

include:
  - _pages
  - files

exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - cv
  - deploy.sh
  - deploy.ps1
  - "preview-*.html"
  - .github
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - vendor

# ---------------------------------------------------------------- Markdown
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

permalink: /:categories/:title/

# ---------------------------------------------------------------- Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml
