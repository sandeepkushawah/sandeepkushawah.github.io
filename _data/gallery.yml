# Research gallery content. Each section has a title, description, and items.
# item types: "image" (static figure), "gif" (animation), "video" (mp4).
# Animations are served as small looping MP4s (converted from the original GIFs,
# ~10-20x smaller). To add one: ffmpeg -i in.gif -movflags +faststart -pix_fmt yuv420p
#   -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -crf 24 out.mp4
# poster = lightweight thumbnail shown in the grid; src = full media opened in the lightbox.
# Figures in images/synopsis/ come from the Doctoral Synopsis Seminar (1 Oct 2026).

- title: "The puzzle: a slowdown the structure barely shows"
  desc: "Kob–Andersen mixture at ρ = 1.2, cooled from T = 2.0 to 0.44. The relaxation time grows by several thousand times, yet the pair structure g(r) hardly changes. Correlators develop a cage plateau — the classic two-step relaxation."
  items:
    - { type: image, poster: /images/posters/syn_ka_box.jpg, src: /images/synopsis/ka_box.jpg, title: "The Kob–Andersen 80:20 mixture", desc: "N = 8000 particles: 6400 A (grey), 1600 B (red)" }
    - { type: gif, poster: /images/posters/gr_cooling.jpg, src: /images/synopsis/gr_cooling.mp4, title: "g(r) on cooling", desc: "The first peak sharpens — the structure barely changes" }
    - { type: gif, poster: /images/posters/fs_two_step.jpg, src: /images/synopsis/fs_two_step.mp4, title: "Two-step relaxation of Fs(k,t)", desc: "A cage plateau opens and τα grows on cooling" }
    - { type: gif, poster: /images/posters/msd_two_step.jpg, src: /images/synopsis/msd_two_step.mp4, title: "Mean-squared displacement", desc: "Ballistic → caged plateau → diffusive" }
    - { type: image, poster: /images/posters/syn_alpha2_nongaussian.jpg, src: /images/synopsis/alpha2_nongaussian.jpg, title: "Non-Gaussian parameter α₂(t)", desc: "Its peak grows and shifts on cooling: heterogeneity builds up" }
    - { type: image, poster: /images/posters/syn_statepoint_map.jpg, src: /images/synopsis/statepoint_map.jpg, title: "State-point map", desc: "≈170 state points on four isochores, coloured by log τ" }

- title: "Dynamics &amp; cooperative motion"
  desc: "How particles move and cluster as the liquid is supercooled, straight from molecular dynamics trajectories."
  items:
    - { type: gif, poster: /images/posters/anim1_glass_transition.jpg, src: /images/anim1_glass_transition.mp4, title: "Particle dynamics across the glass transition", desc: "Single-particle motion from liquid to glass" }
    - { type: image, poster: /images/posters/syn_mobility_territories.jpg, src: /images/synopsis/mobility_territories.jpg, title: "Fast and slow territories", desc: "A particles coloured by mobility at each density's Tc; mobile (red) vs immobile (blue) 5%" }
    - { type: image, poster: /images/posters/syn_longest_strings.jpg, src: /images/synopsis/longest_strings.jpg, title: "Longest mobile strings at Tc", desc: "Green t = 0, red t = t*: quasi-linear chains at every density" }
    - { type: image, poster: /images/posters/syn_vanhove_tail.jpg, src: /images/synopsis/vanhove_tail.jpg, title: "Van Hove function at t*", desc: "Caged main peak plus a non-Gaussian hopping tail" }
    - { type: image, poster: /images/diffused_particle.jpg, src: /images/diffused_particle.jpg, title: "Mobile-particle trajectory", desc: "Path of a diffusing particle in a supercooled liquid" }

