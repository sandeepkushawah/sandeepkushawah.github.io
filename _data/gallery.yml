    - { type: gif, poster: /images/posters/clustert0d1p8.jpg, src: /images/clustert0d1p8.mp4, title: "Mobile cluster · ρ = 1.8 · t = 0", desc: "157 A-type particles" }
    - { type: image, poster: /images/clustertt8d1p2.jpeg, src: /images/clustertt8d1p2.jpeg, title: "Mobile cluster · ρ = 1.2 · t = t*", desc: "Snapshot — 151 A-type particles" }
    - { type: gif, poster: /images/posters/clusterttd1p2.jpg, src: /images/clusterttd1p2.mp4, title: "Mobile cluster · ρ = 1.2 · t = t*", desc: "151 A-type particles" }
