- title: "Structure, cages &amp; orientational order"
  desc: "How I quantify local structure — from the radial distribution function to the full four-point angular distribution in a particle-centred frame — and what a particle's cage actually looks like."
  items:
    - { type: gif, poster: /images/posters/cage_rotating.jpg, src: /images/synopsis/cage_rotating.mp4, title: "A particle's cage in 3D", desc: "Neighbour shell around a central particle (A red, B blue)" }
    - { type: image, poster: /images/posters/syn_molecular_cage.jpg, src: /images/synopsis/molecular_cage.jpg, title: "The molecular cage and its relaxation channels", desc: "(a) 3D KA cage at ρ = 1.2; (b) paths and string moves between neighbours" }
    - { type: image, poster: /images/posters/syn_angular_cage_spheres.jpg, src: /images/synopsis/angular_cage_spheres.jpg, title: "The cage is not round", desc: "gαβ(r = 2.2, θ, φ) on the unit sphere for AA, AB, BA, BB (T = 0.45, ρ = 1.2)" }
    - { type: image, poster: /images/rAN.jpg, src: /images/rAN.jpg, title: "Angular distribution around A (all neighbours)", desc: "Probability of finding an A or B particle at (r,θ,φ) around an A particle" }
    - { type: image, poster: /images/rAB.jpg, src: /images/rAB.jpg, title: "Angular distribution around A (B neighbours)", desc: "Probability of finding a B particle at (r,θ,φ) around an A particle" }
    - { type: image, poster: /images/posters/syn_equal_volume_sphere.jpg, src: /images/synopsis/equal_volume_sphere.jpg, title: "Equal solid-angle binning", desc: "Cells of equal volume on each spherical shell" }
    - { type: image, poster: /images/coordframe1.jpg, src: /images/coordframe1.jpg, title: "Particle-centred frame", desc: "Spherical coordinate / angular binning scheme" }
    - { type: image, poster: /images/rdf.jpg, src: /images/rdf.jpg, title: "Radial distribution function", desc: "Counting neighbours in a shell at distance r" }

- title: "Concepts &amp; schematics"
  desc: "The physical picture behind the work: how a cooling liquid avoids crystallisation, gets caged on its energy landscape, and falls out of equilibrium into a glass."
  items:
    - { type: image, poster: /images/gas_liquid_solid.png, src: /images/gas_liquid_solid.png, title: "Crystal vs glass", desc: "How cooling rate selects the final state" }
    - { type: image, poster: /images/fig1_glass_states.png, src: /images/fig1_glass_states.png, title: "Liquid → supercooled → glass", desc: "States across the glass transition" }
    - { type: image, poster: /images/posters/syn_pel_schematic.jpg, src: /images/synopsis/pel_schematic.jpg, title: "Potential energy landscape", desc: "Caging within basins, activated hopping between them" }
    - { type: image, poster: /images/posters/syn_cage_not_round_schematic.jpg, src: /images/synopsis/cage_not_round_schematic.jpg, title: "What g(r) keeps vs what the particle sees", desc: "The angular average hides the gaps in a cage" }
    - { type: image, poster: /images/posters/syn_ka_kawca_potential.jpg, src: /images/synopsis/ka_kawca_potential.jpg, title: "KA vs purely repulsive KAWCA", desc: "Same model with the attraction removed" }
    - { type: image, poster: /images/glass_transition.jpg, src: /images/glass_transition.jpg, title: "Theories of the glass transition", desc: "Frustration vs competing orderings" }
    - { type: image, poster: /images/simulation_flow.png, src: /images/simulation_flow.png, title: "Simulation workflow", desc: "Equilibration and production runs" }
